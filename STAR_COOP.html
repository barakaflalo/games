<script>
"use strict";
/* =========================================================================
   GAME ENGINE — waves, formations, enemies, collisions, combo, missions
   ========================================================================= */
const G = {
  running:false, state:"idle",
  score:0, wave:0, lives:0, bombs:0, kills:0, time:0,
  combo:0, comboT:0, streak:0, streakT:0, bestCombo:0,
  weapon:"normal", wTimer:0, shieldT:0, fireCd:0,
  px:0, py:0, roll:0,
  enemies:[], pups:[], boss:null, bossMax:0, bossKey:"",
  spawnT:0, spawnGap:1, waveQuota:0, waveSpawned:0, waveKilled:0, waveClear:false,
  pattern:"line", patT:0,
  mission:null, msnDone:false, hitThisWave:false, pupsGot:0,
  invuln:0, dead:false, respawnT:0, intermission:0
};
let shake = 0, inX = 0, inY = 0, firing = false;
const D = () => DIFF[S.diff] || DIFF.normal;

const PATTERNS = ["line","vee","zigzag","arc","swarm","spiral"];
const MISSION_POOL = [
  {t:"kill",     n:[10,14,18]},
  {t:"survive",  n:[20,25,30]},
  {t:"pups",     n:[2,3,4]},
  {t:"streak",   n:[4,5,6]},
  {t:"nohit",    n:[1,1,1]}
];

/* ---------- wave setup ---------- */
function enemyMixFor(wave){
  const pool = ["hen","hen","chick"];
  if(wave >= 2) pool.push("chick","rock");
  if(wave >= 3) pool.push("ufo","hen");
  if(wave >= 4) pool.push("rooster","mine");
  if(wave >= 6) pool.push("squid","ufo");
  if(wave >= 8) pool.push("drone","rooster");
  if(wave >= 11) pool.push("drone","squid","mine");
  return pool;
}
function startWave(n){
  G.wave = n;
  G.waveSpawned = 0; G.waveKilled = 0; G.waveClear = false;
  G.hitThisWave = true; G.pupsGot = 0; G.patT = 0;
  G.pattern = PATTERNS[Math.floor(Math.random()*PATTERNS.length)];
  const isBoss = n % 5 === 0;
  if(isBoss){
    G.waveQuota = 0;
    spawnBoss(n);
  }else{
    G.waveQuota = Math.round(Math.min(9 + n*2.6, 34) * D().pace);
    G.spawnGap = Math.max(.34, (1.15 - n*0.035)) / D().pace;
    G.spawnT = .6;
    G.boss = null;
  }
  G.mission = pickMission(n);
  G.msnDone = false;
  showMsg(T("m_wave", {n:n}), 1.6);
  if(isBoss){ showMsg(T("m_boss"), 2.2); sfxBoss(); }
  syncHUD();
}
function pickMission(n){
  if(n < 2 || n % 5 === 0) return null;
  const m = MISSION_POOL[Math.floor(Math.random()*MISSION_POOL.length)];
  const tier = n < 5 ? 0 : n < 10 ? 1 : 2;
  return {t:m.t, tgt:m.n[tier], cnt:0, timer:0};
}
function missionText(){
  const m = G.mission; if(!m) return "";
  if(G.msnDone) return "✅ +500";
  const done = m.t === "survive" ? Math.floor(m.timer) : m.t === "nohit" ? 0 : m.cnt;
  const label = T("msn_"+m.t, {n:m.tgt});
  return m.t === "nohit" ? "🎯 " + label : "🎯 " + label + " (" + done + "/" + m.tgt + ")";
}
function missionTick(dt){
  const m = G.mission; if(!m || G.msnDone) return;
  if(m.t === "survive"){ m.timer += dt; if(m.timer >= m.tgt) completeMission(); }
  if(m.t === "nohit" && G.waveClear && G.hitThisWave) completeMission();
}
function completeMission(){
  if(G.msnDone) return;
  G.msnDone = true; G.score += 500; sfxMsn(); showMsg(T("m_msn"), 1.6); syncHUD();
}

/* ---------- spawning ---------- */
function spawnEnemy(){
  const pool = enemyMixFor(G.wave);
  const type = pool[Math.floor(Math.random()*pool.length)];
  addEnemy(type, null, null, 1);
  G.waveSpawned++;
}
function addEnemy(type, x, y, scale){
  const st = ET[type];
  const m = makeEnemyMesh(type, scale);
  const t = G.patT;
  if(x === null || x === undefined){
    const p = G.pattern;
    if(p === "line")        { x = (Math.random()-.5)*2*BX*.82; y = (Math.random()-.5)*2*BY*.5; }
    else if(p === "vee")    { const k = G.waveSpawned % 9 - 4; x = k*BX*.2; y = BY*.35 - Math.abs(k)*BY*.11; }
    else if(p === "zigzag") { x = Math.sin(t*1.1)*BX*.72; y = (Math.random()-.5)*2*BY*.42; }
    else if(p === "arc")    { const a = (G.waveSpawned/7)*Math.PI*2; x = Math.cos(a)*BX*.66; y = Math.sin(a)*BY*.42; }
    else if(p === "swarm")  { x = (Math.random()-.5)*2*BX*.5; y = (Math.random()-.5)*2*BY*.4; }
    else                    { const a = G.waveSpawned*.9; x = Math.cos(a)*BX*.2*(1+G.waveSpawned*.06); y = Math.sin(a)*BY*.16*(1+G.waveSpawned*.06); }
  }
  x = Math.max(-BX*.95, Math.min(BX*.95, x));
  y = Math.max(-BY*.85, Math.min(BY*.85, y));
  m.position.set(x, y, SPAWN_Z + Math.random()*18);
  scene.add(m);
  const hp = Math.max(1, Math.round(st.hp * D().hp * Math.min(1 + G.wave*0.05, 2.2) * (scale || 1)));
  const e = {
    mesh:m, type:type, hp:hp, maxhp:hp, r:st.r*(scale||1), sc:st.sc,
    vz:st.spd * D().espd * (.85 + Math.random()*.35),
    fireT: st.fire ? (0.8 + Math.random()*st.fire) * D().fireMul : 0,
    fireGap: st.fire * D().fireMul,
    phase:Math.random()*Math.PI*2, amp:1.4 + Math.random()*2.6,
    baseX:x, baseY:y, spin:(Math.random()-.5)*2, flap:Math.random()*6,
    dive:(type === "rooster" || type === "chick"), splits:(type === "rock" && (scale||1) >= 1),
    scale:scale || 1, t:0
  };
  G.enemies.push(e);
  return e;
}
function spawnBoss(wave){
  const def = BOSSES[Math.floor(wave/5 - 1) % BOSSES.length];
  const m = makeBoss(def.id);
  m.position.set(0, BY*.25, SPAWN_Z + 20);
  scene.add(m);
  const hp = Math.round(def.hp * D().hp * (1 + Math.floor(wave/5)*0.35));
  G.boss = {
    mesh:m, id:def.id, hp:hp, r:def.r, t:0, fireT:1.6,
    fireGap:def.fire * D().fireMul, sc:def.sc, entering:true, minionT:4
  };
  G.bossMax = hp; G.bossKey = def.key;
  $("bossbar").style.display = "block";
  syncHUD();
}

/* ---------- firing ---------- */
function playerFire(){
  const w = WEAPONS[G.weapon] || WEAPONS.normal;
  const speed = 105;
  const shoot = (ox, vx0, vy0, homing)=>{
    const b = takePB(); if(!b) return;
    b.on = true; b.m.visible = true;
    b.m.position.set(G.px + ox, G.py, PLAYER_Z - 1.6);
    b.m.scale.setScalar(G.weapon === "laser" ? 1.6 : 1);
    b.vx = vx0; b.vy = vy0; b.vz = -speed;
    b.dmg = w.dmg; b.homing = !!homing; b.life = 2.6;
  };
  if(G.weapon === "double"){ shoot(-.7, 0, 0); shoot(.7, 0, 0); }
  else if(G.weapon === "spread"){ shoot(0,0,0); shoot(-.5,-26,0); shoot(.5,26,0); shoot(0,0,20); }
  else if(G.weapon === "homing"){ shoot(-.7,0,0,true); shoot(.7,0,0,true); }
  else if(G.weapon === "laser"){ shoot(-.35,0,0); shoot(.35,0,0); }
  else shoot(0,0,0);
  G.weapon === "laser" ? sfxLaser() : sfxShot();
}
function enemyFire(e){
  const st = ET[e.type];
  const egg = (e.type === "hen" || e.type === "rooster");
  const b = takeEB(egg); if(!b) return;
  b.on = true; b.m.visible = true;
  b.m.position.copy(e.mesh.position);
  const sp = (egg ? 34 : 46) * D().espd;
  if(egg){ b.vx = (Math.random()-.5)*3; b.vy = -7; b.vz = sp; }
  else{
    const dx = G.px - e.mesh.position.x, dy = G.py - e.mesh.position.y, dz = PLAYER_Z - e.mesh.position.z;
    const L = Math.hypot(dx, dy, dz) || 1;
    b.vx = dx/L*sp; b.vy = dy/L*sp; b.vz = dz/L*sp;
  }
  b.life = 4.5;
  sfxEShot();
}
function bossFire(){
  const b = G.boss; if(!b) return;
  const n = b.id === "core" ? 9 : b.id === "ship" ? 7 : 5;
  const spread = b.id === "core" ? Math.PI*2 : 1.5;
  for(let i=0;i<n;i++){
    const p = takeEB(false); if(!p) break;
    p.on = true; p.m.visible = true;
    p.m.position.copy(b.mesh.position);
    const a = b.id === "core" ? (i/n)*Math.PI*2 + b.t : -spread/2 + (i/(n-1))*spread;
    const sp = 42 * D().espd;
    p.vx = Math.sin(a)*sp*.55; p.vy = (b.id === "core" ? Math.cos(a)*sp*.55 : -Math.abs(Math.cos(a))*sp*.2);
    p.vz = sp; p.life = 5;
  }
  sfxEShot();
}

/* ---------- power-ups ---------- */
function dropPup(x, y, z, forceType){
  const types = ["double","spread","laser","homing","shield","bomb"];
  let tp = forceType || types[Math.floor(Math.random()*types.length)];
  if(!forceType && Math.random() < .05) tp = "life";
  const col = PUP_COLORS[tp] || 0xffffff;
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(.72, 0), emat(col, .9));
  m.position.set(x, y, z); scene.add(m);
  G.pups.push({mesh:m, type:tp, t:0, vz:26});
}
function grabPup(p){
  G.pupsGot++;
  if(p.type === "shield"){ G.shieldT = 9; showMsg(T("m_shield"), 1.1); }
  else if(p.type === "bomb"){ G.bombs = Math.min(9, G.bombs + 1); showMsg("💥 +1", 1); }
  else if(p.type === "life"){ G.lives++; showMsg(T("m_life"), 1.2); }
  else { G.weapon = p.type; G.wTimer = 13; showMsg(T("m_pup", {n:T(WEAPONS[p.type].key)}), 1.1); }
  if(G.mission && G.mission.t === "pups" && !G.msnDone){
    G.mission.cnt++; if(G.mission.cnt >= G.mission.tgt) completeMission();
  }
  sfxPup(); syncHUD();
}

/* ---------- damage and death ---------- */
function killEnemy(e, idx, byBomb){
  G.combo++; G.comboT = 2; G.streak++; G.streakT = 1.6;
  if(G.combo > G.bestCombo) G.bestCombo = G.combo;
  const mult = Math.min(G.combo, 10);
  G.score += e.sc * mult;
  G.kills++; G.waveKilled++;
  if(G.streak >= 2 && G.streak <= 7 && !byBomb){ showKMsg(T("k"+Math.min(G.streak,7))); sfxCombo(); }
  if(G.mission && !G.msnDone){
    const m = G.mission;
    if(m.t === "kill"){ m.cnt++; if(m.cnt >= m.tgt) completeMission(); }
    if(m.t === "streak" && G.combo >= m.tgt) completeMission();
  }
  const p = e.mesh.position;
  burst(p.x, p.y, p.z, e.type === "rock" ? 0x9a9184 : 0xffa030, false);
  sfxBoom();
  if(e.splits && !byBomb){
    for(let k=0;k<2;k++){
      const c = addEnemy("rock", p.x + (k?1.4:-1.4), p.y + (Math.random()-.5), .55);
      c.mesh.position.z = p.z; c.splits = false;
    }
  }
  if(Math.random() < ET[e.type].drop * D().drop) dropPup(p.x, p.y, p.z);
  disposeObj(e.mesh);
  G.enemies.splice(idx, 1);
  syncHUD();
}
function hurtPlayer(){
  if(G.invuln > 0 || G.dead || G.state !== "playing") return;
  if(G.shieldT > 0){ G.shieldT = 0; burst(G.px, G.py, PLAYER_Z, 0x8ad4ff, false); sfxHit(); syncHUD(); return; }
  G.hitThisWave = true;
  G.lives--; G.combo = 0; G.streak = 0;
  flashDamage();
  burst(G.px, G.py, PLAYER_Z, 0xffc14d, true);
  sfxHurt();
  if(G.lives <= 0){ G.lives = 0; gameOver(); return; }
  G.invuln = 2.2; G.weapon = "normal"; G.wTimer = 0;
  showMsg(T("m_lost", {n:G.lives}), 1.3);
  for(let i=0;i<EB.length;i++) if(EB[i].on){ EB[i].on = false; EB[i].m.visible = false; }
  syncHUD();
}
function useBomb(){
  if(G.bombs <= 0 || G.state !== "playing") return;
  G.bombs--;
  showMsg(T("m_bomb"), 1.1);
  sfxBigBoom();
  burst(G.px, G.py, PLAYER_Z - 20, 0xfff0a0, true);
  if(S.shake) shake = .8;
  for(let i=G.enemies.length-1;i>=0;i--) killEnemy(G.enemies[i], i, true);
  if(G.boss){ damageBoss(10); }
  for(let i=0;i<EB.length;i++) if(EB[i].on){ EB[i].on = false; EB[i].m.visible = false; }
  syncHUD();
}
function damageBoss(d){
  const b = G.boss; if(!b) return;
  b.hp -= d;
  const p = b.mesh.position;
  burst(p.x + (Math.random()-.5)*4, p.y + (Math.random()-.5)*3, p.z, 0xffb040, false);
  if(b.hp <= 0){
    G.score += b.sc * Math.max(1, Math.min(G.combo, 10));
    G.kills++;
    burst(p.x, p.y, p.z, 0xff6020, true);
    burst(p.x+3, p.y+2, p.z, 0xffd060, true);
    burst(p.x-3, p.y-2, p.z, 0xff3020, true);
    sfxBigBoom();
    disposeObj(b.mesh); G.boss = null;
    $("bossbar").style.display = "none";
    for(let k=0;k<3;k++) dropPup(p.x + (k-1)*2.5, p.y, p.z);
    G.waveClear = true;
    G.intermission = 2.2;
  }
  syncHUD();
}

/* ---------- per-frame update ---------- */
function updateGame(dt){
  G.time += dt;
  G.patT += dt;
  if(G.comboT > 0){ G.comboT -= dt; if(G.comboT <= 0) G.combo = 0; }
  if(G.streakT > 0){ G.streakT -= dt; if(G.streakT <= 0) G.streak = 0; }
  if(G.invuln > 0) G.invuln -= dt;
  if(G.shieldT > 0){ G.shieldT -= dt; if(G.shieldT <= 0) syncHUD(); }
  if(G.wTimer > 0){ G.wTimer -= dt; if(G.wTimer <= 0){ G.weapon = "normal"; syncHUD(); } }
  missionTick(dt);

  /* --- player --- */
  const acc = 96, damp = 9.5;
  G.px += inX * acc * dt * .55;
  G.py += -inY * acc * dt * .55;
  G.px = Math.max(-BX, Math.min(BX, G.px));
  G.py = Math.max(-BY, Math.min(BY, G.py));
  G.roll += ((-inX * .55) - G.roll) * Math.min(1, dt * 8);
  if(ship){
    ship.position.set(G.px, G.py, PLAYER_Z);
    ship.rotation.z = G.roll;
    ship.rotation.x = inY * .18;
    const fl = .85 + Math.random()*.4;
    if(ship.userData.fire0) ship.userData.fire0.scale.z = fl;
    if(ship.userData.fire1) ship.userData.fire1.scale.z = fl;
    ship.visible = !(G.invuln > 0 && Math.floor(G.invuln*12) % 2 === 0);
  }
  if(shieldMesh){
    shieldMesh.visible = G.shieldT > 0;
    shieldMesh.position.set(G.px, G.py, PLAYER_Z);
    shieldMesh.rotation.y += dt * 1.4;
    shieldMesh.scale.setScalar(1 + Math.sin(G.time*7)*.05);
  }
  G.fireCd -= dt;
  const wantFire = firing || S.autofire;
  if(wantFire && G.fireCd <= 0 && !G.dead){
    G.fireCd = D().pcd * (WEAPONS[G.weapon] || WEAPONS.normal).cd;
    playerFire();
  }

  /* --- spawning --- */
  if(!G.boss && G.state === "playing" && G.intermission <= 0){
    if(G.waveSpawned < G.waveQuota){
      G.spawnT -= dt;
      if(G.spawnT <= 0){ G.spawnT = G.spawnGap * (.6 + Math.random()*.9); spawnEnemy(); }
    }else if(G.enemies.length === 0 && !G.waveClear){
      G.waveClear = true;
      if(G.mission && G.mission.t === "nohit" && !G.hitThisWave) completeMission();
      G.intermission = 1.6;
    }
  }
  if(G.intermission > 0){
    G.intermission -= dt;
    if(G.intermission <= 0 && G.state === "playing") startWave(G.wave + 1);
  }

  /* --- enemies --- */
  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i], m = e.mesh;
    e.t += dt;
    m.position.z += e.vz * dt;
    const p = G.pattern;
    if(p === "zigzag")      m.position.x = e.baseX + Math.sin(e.t*2.1 + e.phase) * e.amp;
    else if(p === "arc")    { m.position.x = e.baseX + Math.sin(e.t*1.3 + e.phase)*e.amp*.8;
                              m.position.y = e.baseY + Math.cos(e.t*1.3 + e.phase)*e.amp*.5; }
    else if(p === "spiral") { const a = e.t*1.6 + e.phase;
                              m.position.x = e.baseX + Math.cos(a)*e.amp; m.position.y = e.baseY + Math.sin(a)*e.amp*.6; }
    else if(p === "vee")    m.position.y = e.baseY + Math.sin(e.t*1.5 + e.phase)*.9;
    else if(p === "swarm" || e.dive){
      if(m.position.z > -55){
        m.position.x += (G.px - m.position.x) * Math.min(1, dt * .9);
        m.position.y += (G.py - m.position.y) * Math.min(1, dt * .7);
      }
    }
    /* per-type flourish */
    if(e.type === "chick" || e.type === "hen" || e.type === "rooster"){
      e.flap += dt * 11;
      const w = m.userData.wings;
      if(w){ const a = Math.sin(e.flap)*.75; w[0].rotation.z = .2 + a; w[1].rotation.z = -.2 - a; }
      m.rotation.z = Math.sin(e.t*2)*.12;
    }else if(e.type === "ufo"){
      m.rotation.y += dt*2.2;
      const L = m.userData.lights;
      if(L) for(let k=0;k<L.length;k++) L[k].material.emissiveIntensity = .4 + .8*Math.abs(Math.sin(e.t*4 + k));
    }else if(e.type === "squid"){
      const A = m.userData.arms;
      if(A) for(let k=0;k<A.length;k++) A[k].m.rotation.z = Math.sin(e.t*4 + k)*.35;
      m.rotation.z += dt*.6;
    }else if(e.type === "drone"){
      const R = m.userData.rings;
      if(R) for(let k=0;k<R.length;k++) R[k].rotation.z += dt*14;
      if(m.userData.eye) m.userData.eye.material.emissiveIntensity = .7 + Math.abs(Math.sin(e.t*5))*.9;
    }else if(e.type === "mine"){
      m.rotation.y += dt*1.1;
      if(m.userData.led) m.userData.led.material.emissiveIntensity = Math.sin(e.t*7) > 0 ? 1.6 : .2;
    }else if(e.type === "rock"){
      m.rotation.x += dt*e.spin*.8; m.rotation.y += dt*e.spin;
    }
    m.position.x = Math.max(-BX*1.15, Math.min(BX*1.15, m.position.x));
    m.position.y = Math.max(-BY*1.05, Math.min(BY*1.05, m.position.y));
    /* firing */
    if(e.fireGap > 0 && m.position.z > -85){
      e.fireT -= dt;
      if(e.fireT <= 0){ e.fireT = e.fireGap * (.7 + Math.random()*.9); enemyFire(e); }
    }
    /* contact with player */
    if(!G.dead && G.invuln <= 0 && Math.abs(m.position.z - PLAYER_Z) < e.r + 1.2){
      const dx = m.position.x - G.px, dy = m.position.y - G.py;
      if(dx*dx + dy*dy < (e.r + 1.05)*(e.r + 1.05)){
        burst(m.position.x, m.position.y, m.position.z, 0xff7040, false);
        disposeObj(e.mesh); G.enemies.splice(i, 1);
        hurtPlayer(); continue;
      }
    }
    if(m.position.z > DESPAWN_Z){ disposeObj(e.mesh); G.enemies.splice(i, 1); }
  }

  /* --- boss --- */
  if(G.boss){
    const b = G.boss, m = b.mesh; b.t += dt;
    if(b.entering){
      m.position.z += 26 * dt;
      if(m.position.z >= -42){ m.position.z = -42; b.entering = false; }
    }else{
      m.position.x = Math.sin(b.t*.55) * BX*.62;
      m.position.y = BY*.22 + Math.sin(b.t*.9)*BY*.16;
      m.position.z = -42 + Math.sin(b.t*.35)*7;
      b.fireT -= dt;
      if(b.fireT <= 0){ b.fireT = b.fireGap; bossFire(); }
      b.minionT -= dt;
      if(b.minionT <= 0){ b.minionT = 5.5; addEnemy(b.id === "hen" ? "chick" : "drone", m.position.x, m.position.y, 1); }
    }
    if(m.userData.spin) m.userData.spin.rotation.z += dt*1.2;
    if(m.userData.ring0) m.userData.ring0.rotation.z += dt*.9;
    if(m.userData.ring1) m.userData.ring1.rotation.x += dt*1.1;
    if(m.userData.ring2) m.userData.ring2.rotation.y += dt*.7;
    if(m.userData.core) m.userData.core.material.emissiveIntensity = .8 + Math.abs(Math.sin(b.t*3))*.7;
    if(!G.dead && G.invuln <= 0 && Math.abs(m.position.z - PLAYER_Z) < b.r + 1.4){
      const dx = m.position.x - G.px, dy = m.position.y - G.py;
      if(dx*dx + dy*dy < (b.r + 1.1)*(b.r + 1.1)) hurtPlayer();
    }
  }

  /* --- player bullets --- */
  for(let i=0;i<PB.length;i++){
    const b = PB[i]; if(!b.on) continue;
    b.life -= dt;
    if(b.homing){
      let best = null, bd = 1e9;
      for(let k=0;k<G.enemies.length;k++){
        const e = G.enemies[k];
        const d = e.mesh.position.distanceToSquared(b.m.position);
        if(d < bd){ bd = d; best = e.mesh.position; }
      }
      if(!best && G.boss) best = G.boss.mesh.position;
      if(best){
        b.vx += (best.x - b.m.position.x) * 5.5 * dt * 3;
        b.vy += (best.y - b.m.position.y) * 5.5 * dt * 3;
        b.vx = Math.max(-60, Math.min(60, b.vx));
        b.vy = Math.max(-60, Math.min(60, b.vy));
      }
    }
    b.m.position.x += b.vx * dt;
    b.m.position.y += b.vy * dt;
    b.m.position.z += b.vz * dt;
    if(b.life <= 0 || b.m.position.z < SPAWN_Z - 12){ b.on = false; b.m.visible = false; continue; }
    /* hit enemies */
    let hit = false;
    for(let k=G.enemies.length-1;k>=0;k--){
      const e = G.enemies[k];
      const dx = e.mesh.position.x - b.m.position.x;
      const dy = e.mesh.position.y - b.m.position.y;
      const dz = e.mesh.position.z - b.m.position.z;
      const rr = e.r + .55;
      if(dx*dx + dy*dy + dz*dz < rr*rr){
        e.hp -= b.dmg;
        burst(b.m.position.x, b.m.position.y, b.m.position.z, 0xffe08a, false);
        if(e.hp <= 0) killEnemy(e, k, false); else sfxHit();
        hit = true; break;
      }
    }
    if(!hit && G.boss && !G.boss.entering){
      const p = G.boss.mesh.position;
      const dx = p.x - b.m.position.x, dy = p.y - b.m.position.y, dz = p.z - b.m.position.z;
      const rr = G.boss.r + .6;
      if(dx*dx + dy*dy + dz*dz < rr*rr){ damageBoss(b.dmg); sfxHit(); hit = true; }
    }
    if(hit){ b.on = false; b.m.visible = false; }
  }

  /* --- enemy bullets --- */
  for(let i=0;i<EB.length;i++){
    const b = EB[i]; if(!b.on) continue;
    b.life -= dt;
    if(b.egg) b.vy -= 11 * dt;
    b.m.position.x += b.vx * dt;
    b.m.position.y += b.vy * dt;
    b.m.position.z += b.vz * dt;
    b.m.rotation.x += dt*4;
    if(b.life <= 0 || b.m.position.z > DESPAWN_Z + 4 || b.m.position.y < -BY*1.6){
      b.on = false; b.m.visible = false; continue;
    }
    if(!G.dead && G.invuln <= 0 && Math.abs(b.m.position.z - PLAYER_Z) < 1.5){
      const dx = b.m.position.x - G.px, dy = b.m.position.y - G.py;
      if(dx*dx + dy*dy < 1.5){
        b.on = false; b.m.visible = false;
        hurtPlayer();
      }
    }
  }

  /* --- power-ups --- */
  for(let i=G.pups.length-1;i>=0;i--){
    const p = G.pups[i];
    p.t += dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.rotation.y += dt*2.6; p.mesh.rotation.x += dt*1.4;
    p.mesh.scale.setScalar(1 + Math.sin(p.t*5)*.12);
    if(Math.abs(p.mesh.position.z - PLAYER_Z) < 6){
      p.mesh.position.x += (G.px - p.mesh.position.x) * Math.min(1, dt*3);
      p.mesh.position.y += (G.py - p.mesh.position.y) * Math.min(1, dt*3);
    }
    const dx = p.mesh.position.x - G.px, dy = p.mesh.position.y - G.py, dz = p.mesh.position.z - PLAYER_Z;
    if(dx*dx + dy*dy + dz*dz < 6.2){ grabPup(p); disposeObj(p.mesh); G.pups.splice(i,1); continue; }
    if(p.mesh.position.z > DESPAWN_Z){ disposeObj(p.mesh); G.pups.splice(i,1); }
  }

  /* --- particles --- */
  for(let i=0;i<PARTS.length;i++){
    const p = PARTS[i]; if(!p.on) continue;
    p.life -= dt;
    if(p.life <= 0){ p.on = false; p.m.visible = false; continue; }
    p.m.position.x += p.vx * dt;
    p.m.position.y += p.vy * dt;
    p.m.position.z += p.vz * dt;
    p.vx *= .95; p.vy *= .95; p.vz *= .95;
    p.m.material.opacity = p.life / p.max;
    p.m.rotation.x += dt*7; p.m.rotation.y += dt*5;
  }

  /* --- stars --- */
  if(starPoints){
    const a = starPoints.geometry.attributes.position, arr = a.array;
    for(let i=0;i<starVel.length;i++){
      arr[i*3+2] += starVel[i] * dt;
      if(arr[i*3+2] > 26){
        arr[i*3]   = (Math.random()-.5)*180;
        arr[i*3+1] = (Math.random()-.5)*120;
        arr[i*3+2] = -220;
      }
    }
    a.needsUpdate = true;
  }
  for(let i=0;i<nebulas.length;i++){
    nebulas[i].position.z += 4 * dt;
    if(nebulas[i].position.z > 10){
      nebulas[i].position.set((Math.random()-.5)*150, (Math.random()-.5)*90, -230);
    }
  }
}
</script>
<script>
"use strict";
/* =========================================================================
   SCENE, HUD, RADAR, INPUT, BOOT
   ========================================================================= */
let ambLight, dirLight, playerLight;

function buildScene(){
  const cv = $("c3d");
  renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(52, 1, 0.1, 400);
  camera.position.set(0, 0, 30);
  camera.lookAt(0, 0, -30);
  clock = new THREE.Clock();

  const c = THEME3D[S.theme] || THEME3D.gold;
  scene.background = new THREE.Color(c.sky);
  scene.fog = new THREE.Fog(c.sky, 120, 260);
  ambLight = new THREE.AmbientLight(0xffffff, .55); scene.add(ambLight);
  dirLight = new THREE.DirectionalLight(0xffffff, .85); dirLight.position.set(-6, 10, 12); scene.add(dirLight);
  scene.add(new THREE.DirectionalLight(0x88aaff, .25).translateZ(-1));
  playerLight = new THREE.PointLight(c.glow, 1.1, 34, 2);
  playerLight.position.set(0, 0, PLAYER_Z + 3); scene.add(playerLight);

  buildStars(); buildNebula(); buildPools();

  ship = makeShip(); scene.add(ship);
  shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(2.5, 18, 14),
    new THREE.MeshPhongMaterial({color:0x8ad4ff, emissive:0x2a7fbf, emissiveIntensity:.5,
      transparent:true, opacity:.26, side:THREE.DoubleSide}));
  shieldMesh.visible = false; scene.add(shieldMesh);

  onResize();
  window.addEventListener("resize", onResize);
}
function computeBounds(){
  const dist = camera.position.z - PLAYER_Z;
  const vH = 2 * Math.tan(camera.fov * Math.PI / 360) * dist;
  const vW = vH * camera.aspect;
  BX = Math.max(4, vW/2 - 1.4);
  BY = Math.max(6, vH/2 - 2.2);
}
function onResize(){
  if(!renderer) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const portrait = camera.aspect < 1;
  // taller screens need the camera further back and a wider lens to fit the field
  camera.fov = portrait ? Math.min(74, 52 + (1 - camera.aspect) * 46) : 52;
  camera.position.set(0, portrait ? 12 : 6, portrait ? 40 : 30);
  camera.lookAt(0, portrait ? -2 : 0, portrait ? -34 : -30);
  camera.updateProjectionMatrix();
  computeBounds();
}
function applyTheme3D(){
  const c = THEME3D[S.theme] || THEME3D.gold;
  if(scene){ scene.background = new THREE.Color(c.sky); if(scene.fog) scene.fog.color.setHex(c.sky); }
  if(playerLight) playerLight.color.setHex(c.glow);
  if(boltMat){ boltMat.color.setHex(c.bolt); boltMat.emissive.setHex(c.bolt); }
  if(starPoints) starPoints.material.color.setHex(c.star);
  if(scene) buildNebula();
  if(ship){ disposeObj(ship); ship = makeShip(); scene.add(ship); }
}

/* ---------- HUD ---------- */
let msgT = null, kmsgT = null;
function showMsg(text, dur){
  const el = $("hud-msg");
  el.querySelector("span").textContent = text;
  el.classList.add("on");
  clearTimeout(msgT);
  msgT = setTimeout(()=>el.classList.remove("on"), (dur || 1.6) * 1000);
}
function showKMsg(text){
  const el = $("hud-kmsg");
  el.textContent = text; el.classList.add("on");
  clearTimeout(kmsgT);
  kmsgT = setTimeout(()=>el.classList.remove("on"), 1100);
}
function flashDamage(){
  const el = $("flash"); el.style.opacity = ".4";
  setTimeout(()=>{ el.style.opacity = "0"; }, 120);
}
function syncHUD(){
  $("hud-score").textContent = fmt(G.score);
  $("hud-combo").textContent = G.combo >= 2 ? "COMBO x" + Math.min(G.combo,10) : "";
  $("hud-wave").textContent = "🌊 " + T("wave") + " " + G.wave +
    (G.boss ? " · " + T(G.bossKey) : (G.waveQuota ? " · " + G.waveKilled + "/" + G.waveQuota : ""));
  $("hud-lives").textContent = "❤️ " + G.lives + "   💥 " + G.bombs;
  const wn = T((WEAPONS[G.weapon] || WEAPONS.normal).key);
  $("hud-weapon").textContent = "🔫 " + wn + (G.wTimer > 0 ? " " + Math.ceil(G.wTimer) + "s" : "") +
    (G.shieldT > 0 ? "  🛡 " + Math.ceil(G.shieldT) + "s" : "");
  const mt = missionText();
  $("hud-mission").textContent = mt;
  $("hud-mission").style.display = mt ? "block" : "none";
  $("bb-n").textContent = G.bombs;
  if(G.boss){
    $("bossbar").style.display = "block";
    $("boss-in").style.width = Math.max(0, G.boss.hp / G.bossMax * 100) + "%";
  }else $("bossbar").style.display = "none";
}

/* ---------- radar ---------- */
let radarCtx = null;
function drawRadar(){
  if(!radarCtx) radarCtx = $("radar").getContext("2d");
  const w = 74, h = 104, x = radarCtx;
  x.clearRect(0,0,w,h);
  x.fillStyle = "rgba(0,0,0,.35)"; x.fillRect(0,0,w,h);
  const accent = getComputedStyle(document.body).getPropertyValue("--gold").trim() || "#d4af37";
  x.strokeStyle = "rgba(255,255,255,.08)"; x.lineWidth = 1;
  for(let i=1;i<4;i++){ x.beginPath(); x.moveTo(0, i*h/4); x.lineTo(w, i*h/4); x.stroke(); }
  const spanX = BX * 1.25, z0 = SPAWN_Z, z1 = DESPAWN_Z;
  const px = v => w/2 + (v / spanX) * (w/2 - 3);
  const pz = v => 3 + ((v - z0) / (z1 - z0)) * (h - 6);
  for(let i=0;i<G.enemies.length;i++){
    const e = G.enemies[i], p = e.mesh.position;
    x.fillStyle = e.type === "rock" ? "#9a9184" : e.type === "mine" ? "#ff5a4a" : "#ff8a5a";
    const s = e.r > 1.4 ? 4 : 3;
    x.fillRect(px(p.x) - s/2, pz(p.z) - s/2, s, s);
  }
  for(let i=0;i<G.pups.length;i++){
    const p = G.pups[i].mesh.position;
    x.fillStyle = accent;
    x.fillRect(px(p.x) - 2, pz(p.z) - 2, 4, 4);
  }
  if(G.boss){
    const p = G.boss.mesh.position;
    x.fillStyle = "#ff2a2a";
    x.fillRect(px(p.x) - 5, pz(p.z) - 4, 10, 8);
  }
  x.fillStyle = accent;
  x.beginPath(); x.arc(px(G.px), pz(PLAYER_Z), 3.4, 0, Math.PI*2); x.fill();
}

/* ---------- render loop ---------- */
let radarT = 0;
function loop(){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta());
  if(G.state === "playing") updateGame(dt);
  if(shake > 0){
    shake = Math.max(0, shake - dt * 2.2);
    camera.position.x = (Math.random()-.5) * shake * 3.4;
    camera.position.y = (Math.random()-.5) * shake * 3.4;
  }else{
    camera.position.x += (0 - camera.position.x) * .2;
    camera.position.y += (0 - camera.position.y) * .2;
  }
  if(playerLight) playerLight.position.set(G.px, G.py, PLAYER_Z + 3);
  radarT += dt;
  if(radarT > .06){ radarT = 0; if(G.state === "playing") drawRadar(); }
  renderer.render(scene, camera);
}

/* ---------- lifecycle ---------- */
function clearEntities(){
  G.enemies.forEach(e=>disposeObj(e.mesh)); G.enemies.length = 0;
  G.pups.forEach(p=>disposeObj(p.mesh)); G.pups.length = 0;
  if(G.boss){ disposeObj(G.boss.mesh); G.boss = null; }
  for(let i=0;i<PB.length;i++){ PB[i].on = false; PB[i].m.visible = false; }
  for(let i=0;i<EB.length;i++){ EB[i].on = false; EB[i].m.visible = false; }
  for(let i=0;i<PARTS.length;i++){ PARTS[i].on = false; PARTS[i].m.visible = false; }
  $("bossbar").style.display = "none";
}
function startGame(){
  if(!window.THREE){ showMsg("Three.js failed to load", 4); return; }
  if(!renderer) buildScene();
  clearEntities();
  const d = D();
  G.running = true; G.state = "playing";
  G.score = 0; G.wave = 0; G.kills = 0; G.time = 0;
  G.lives = d.lives; G.bombs = d.bombs;
  G.combo = 0; G.comboT = 0; G.streak = 0; G.streakT = 0; G.bestCombo = 0;
  G.weapon = "normal"; G.wTimer = 0; G.shieldT = 0; G.fireCd = 0;
  G.px = 0; G.py = -BY * .62; G.roll = 0;
  G.invuln = 1.6; G.dead = false; G.intermission = 0;
  G.mission = null; G.msnDone = false;
  inX = 0; inY = 0; firing = false; shake = 0;
  $("touch").style.display = ("ontouchstart" in window) ? "block" : "none";
  $("ov-over").classList.remove("on"); $("ov-pause").classList.remove("on");
  onResize();
  if(!raf){ clock.getDelta(); raf = requestAnimationFrame(loop); }
  ac(); musicOn();
  startWave(1);
  showMsg(T("m_go"), 1.2);
  syncHUD();
}
function stopGame(){
  G.running = false; G.state = "idle";
  musicOff();
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
  clearEntities();
  $("touch").style.display = "none";
  $("ov-pause").classList.remove("on");
}
function pauseGame(on){
  if(G.state !== "playing" && on) return;
  if(on){ G.state = "paused"; musicOff(); $("ov-pause").classList.add("on"); }
  else if(G.state === "paused"){
    G.state = "playing"; $("ov-pause").classList.remove("on");
    clock.getDelta(); musicOn();
  }
}
function gameOver(){
  G.state = "over"; musicOff();
  const st = S.stats;
  st.games++; st.kills += G.kills; st.time += G.time;
  if(G.score > st.best) st.best = G.score;
  if(G.wave > st.wave) st.wave = G.wave;
  if(G.bestCombo > st.combo) st.combo = G.bestCombo;
  const rank = addScore(G.score, G.wave);
  save(); buildStats(); refreshHome();
  const isTop = rank === 0 && G.score > 0;
  $("over-ico").textContent = isTop ? "🏆" : "💀";
  $("over-title").textContent = isTop ? T("over_win") : T("over_t");
  $("over-score").textContent = fmt(G.score);
  $("over-sub").textContent = T("over_sub", {w:G.wave, k:fmt(G.kills)});
  $("over-hs").innerHTML = rank >= 0
    ? '<div class="hsrow me"><span class="rk">'+(rank+1)+'</span><span class="nm">'+esc(myName())+
      '</span><span class="sc">'+esc(fmt(G.score))+'</span></div>' : "";
  $("over-home").querySelector(".lbl").textContent = T("home");
  $("over-again").querySelector(".lbl").textContent = T("again");
  $("ov-over").classList.add("on");
  sfxBigBoom();
}
$("over-home").onclick = ()=>{ $("ov-over").classList.remove("on"); go("home"); };
$("over-again").onclick = ()=>{ $("ov-over").classList.remove("on"); startGame(); };
$("pause-resume").onclick = ()=>pauseGame(false);
$("pause-quit").onclick = ()=>{ $("ov-pause").classList.remove("on"); go("home"); };

/* ---------- input ---------- */
const keys = {};
function setupInput(){
  addEventListener("keydown", e=>{
    keys[e.code] = true;
    if(current !== "game") return;
    if(e.code === "Space"){ e.preventDefault(); firing = true; }
    if(e.code === "KeyB"){ e.preventDefault(); useBomb(); }
    if(e.code === "Escape" || e.code === "KeyP"){ e.preventDefault(); pauseGame(G.state === "playing"); }
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) >= 0) e.preventDefault();
  });
  addEventListener("keyup", e=>{
    keys[e.code] = false;
    if(e.code === "Space") firing = false;
  });

  const jz = $("jz"), knob = $("jk"), JR = 46;
  let jid = null, jcx = 0, jcy = 0, kbActive = false;
  function moveKnob(t){
    let dx = t.clientX - jcx, dy = t.clientY - jcy;
    const d = Math.hypot(dx, dy);
    if(d > JR){ dx = dx/d*JR; dy = dy/d*JR; }
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
    inX = dx / JR; inY = dy / JR;
  }
  function releaseJoy(){ jid = null; knob.style.transform = "translate(0,0)"; inX = 0; inY = 0; }
  jz.addEventListener("touchstart", e=>{
    e.preventDefault(); ac();
    const t = e.changedTouches[0]; jid = t.identifier;
    const r = jz.getBoundingClientRect();
    jcx = r.left + r.width/2; jcy = r.top + r.height/2;
    moveKnob(t);
  }, {passive:false});
  jz.addEventListener("touchmove", e=>{
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++)
      if(e.changedTouches[i].identifier === jid) moveKnob(e.changedTouches[i]);
  }, {passive:false});
  jz.addEventListener("touchend", e=>{
    for(let i=0;i<e.changedTouches.length;i++)
      if(e.changedTouches[i].identifier === jid) releaseJoy();
  });
  jz.addEventListener("touchcancel", releaseJoy);

  const fb = $("fb");
  fb.addEventListener("touchstart", e=>{ e.preventDefault(); ac(); firing = true; fb.classList.add("act"); }, {passive:false});
  fb.addEventListener("touchend",   e=>{ e.preventDefault(); firing = false; fb.classList.remove("act"); });
  fb.addEventListener("touchcancel",()=>{ firing = false; fb.classList.remove("act"); });
  const bb = $("bb");
  bb.addEventListener("touchstart", e=>{ e.preventDefault(); useBomb(); bb.classList.add("act"); }, {passive:false});
  bb.addEventListener("touchend",   e=>{ e.preventDefault(); bb.classList.remove("act"); });

  /* keyboard drives the same two axes the joystick does */
  setInterval(()=>{
    if(current !== "game" || jid !== null) return;
    let kx = 0, ky = 0;
    if(keys.ArrowLeft || keys.KeyA)  kx -= 1;
    if(keys.ArrowRight || keys.KeyD) kx += 1;
    if(keys.ArrowUp || keys.KeyW)    ky -= 1;
    if(keys.ArrowDown || keys.KeyS)  ky += 1;
    /* on a touchscreen laptop both inputs exist, so only clear what the keys set */
    if(kx || ky){ inX = kx; inY = ky; kbActive = true; }
    else if(kbActive){ inX = 0; inY = 0; kbActive = false; }
  }, 33);
}

/* ---------- PWA ---------- */
function iconDataURL(size){
  const cv = document.createElement("canvas"); cv.width = cv.height = size;
  const x = cv.getContext("2d"), s = size;
  x.fillStyle = "#080808"; x.fillRect(0,0,s,s);
  x.strokeStyle = "#d4af37"; x.lineWidth = s*.05;
  x.beginPath(); x.arc(s/2, s/2, s*.38, 0, Math.PI*2); x.stroke();
  x.fillStyle = "#d4af37";
  x.beginPath();
  x.moveTo(s/2, s*.26); x.lineTo(s*.70, s*.72); x.lineTo(s/2, s*.61); x.lineTo(s*.30, s*.72);
  x.closePath(); x.fill();
  return cv.toDataURL("image/png");
}
function initPWA(){
  const manifest = {
    name:"Star Coop — AppNest", short_name:"Star Coop", start_url:".", scope:".",
    display:"standalone", orientation:"any", background_color:"#080808", theme_color:"#080808",
    description:"A 3D space wave shooter",
    icons:[{src:iconDataURL(192), sizes:"192x192", type:"image/png", purpose:"any maskable"},
           {src:iconDataURL(512), sizes:"512x512", type:"image/png", purpose:"any maskable"}]
  };
  try{
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"}));
    const l = document.createElement("link"); l.rel = "manifest"; l.href = url; document.head.appendChild(l);
  }catch(e){}
  if("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  const ic = iconDataURL(192);
  [["icon"],["apple-touch-icon"]].forEach(r=>{
    const l = document.createElement("link"); l.rel = r[0]; l.href = ic; document.head.appendChild(l);
  });
}

/* ---------- boot ---------- */
(function boot(){
  load();
  applyTheme(); applyLang(); buildSettings(); buildGuide(); buildStats(); refreshHome();
  setupInput(); initPWA();
  document.addEventListener("gesturestart", e=>e.preventDefault());
  $("c3d").addEventListener("contextmenu", e=>e.preventDefault());
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden && G.state === "playing") pauseGame(true); });
  addEventListener("blur", ()=>{ if(G.state === "playing") pauseGame(true); });
  $("pause-title").textContent = T("pause_t");
  $("pause-desc").textContent  = T("pause_d");
  $("pause-resume").querySelector(".lbl").textContent = T("resume");
  $("pause-quit").querySelector(".lbl").textContent   = T("quit");
  if(!S.seenTutorial) setTimeout(openTutorial, 550);
})();
</script>
