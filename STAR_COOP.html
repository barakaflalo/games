<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="Star Coop - AppNest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Star Coop — AppNest</title>
<style>
:root{
  --gold:#d4af37; --gold-soft:#f0d67a; --gold-dim:#8a7228;
  --bg:#080808; --bg2:#111111; --surface:#161616; --line:#2a2a2a;
  --txt:#f2f0e8; --muted:#9a968a; --danger:#c8503f; --ok:#3fa06a;
  --r:14px; --pad:16px;
  --ff-disp:'Cinzel','Playfair Display','Times New Roman',serif;
  --ff-body:'Heebo','Segoe UI',system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="blue"]  {--gold:#5aa2e0;--gold-soft:#a5cff2;--gold-dim:#2f5f8a;--bg:#050a12;--bg2:#0b1422;--surface:#101c2e;--line:#1d3049;}
[data-theme="emerald"]{--gold:#3fd39a;--gold-soft:#9defc9;--gold-dim:#227a58;--bg:#04100c;--bg2:#0a1c16;--surface:#0e2620;--line:#1a3d33;}
[data-theme="purple"] {--gold:#a97ce0;--gold-soft:#d3b6f5;--gold-dim:#5f3f8c;--bg:#0a0612;--bg2:#150e22;--surface:#1c1330;--line:#2e2148;}
[data-theme="crimson"]{--gold:#e0645c;--gold-soft:#f3a9a3;--gold-dim:#8c3730;--bg:#0f0605;--bg2:#1c0d0b;--surface:#261210;--line:#3d1e1a;}
[data-mode="light"]{--bg:#f4f1e8;--bg2:#eae5d8;--surface:#ffffff;--line:#d8d2c2;--txt:#1b1a16;--muted:#6b665a;}
[data-mode="light"][data-theme="blue"]   {--bg:#eef3f9;--bg2:#e0eaf5;--surface:#fff;--line:#c9d8e8;}
[data-mode="light"][data-theme="emerald"]{--bg:#eef7f2;--bg2:#dfeee6;--surface:#fff;--line:#c6e0d2;}
[data-mode="light"][data-theme="purple"] {--bg:#f4f0f9;--bg2:#e8e0f2;--surface:#fff;--line:#d5c8e6;}
[data-mode="light"][data-theme="crimson"]{--bg:#faf0ee;--bg2:#f2e0dc;--surface:#fff;--line:#e8cac4;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--ff-body);font-size:16px;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.brand .chip-mark{animation:none}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 14px calc(var(--safe-b) + 14px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.screen.on{display:flex;animation:slide .28s cubic-bezier(.22,.9,.3,1)}
@keyframes slide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen.game{padding:0;overflow:hidden;background:#000}

.brand{text-align:center;margin:5vh 0 3.5vh}
.brand .chip-mark{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;
  border:3px dashed var(--gold);display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--surface),var(--bg2));
  box-shadow:0 0 26px -6px var(--gold);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip-mark span{font-size:30px}
.brand h1{font-family:var(--ff-disp);font-size:clamp(28px,8vw,44px);margin:0;letter-spacing:.12em;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));-webkit-background-clip:text;
  background-clip:text;color:transparent;font-weight:700}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:.2em;text-transform:uppercase}

.menu{display:flex;flex-direction:column;gap:11px;max-width:440px;width:100%;margin:0 auto;flex:1}
.btn{display:flex;align-items:center;gap:13px;width:100%;padding:17px 18px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);text-align:start;
  transition:transform .12s,border-color .18s;min-height:58px}
.btn:active{transform:scale(.975)}
.btn .ico{font-size:22px;width:30px;text-align:center;flex:none}
.btn .lbl{font-weight:600;font-size:16.5px}
.btn .sub{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.btn.primary{background:linear-gradient(160deg,var(--surface),var(--bg2));border:1.5px solid var(--gold);
  box-shadow:0 6px 22px -12px var(--gold)}
.btn.primary .lbl{color:var(--gold);font-family:var(--ff-disp);letter-spacing:.05em;font-size:19px}
.btn.wide{justify-content:center;text-align:center}
.btn.wide .lbl{font-size:16px}
.btn.danger{border-color:var(--danger)}.btn.danger .lbl{color:var(--danger)}

.quickbar{position:absolute;top:calc(var(--safe-t) + 12px);inset-inline-end:14px;display:flex;gap:8px;z-index:5}
.qb{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;transition:transform .12s}
.qb:active{transform:scale(.9)}
.stack-bar{position:absolute;top:calc(var(--safe-t) + 12px);inset-inline-start:14px;z-index:5;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
  font-size:14px;font-weight:700;color:var(--gold)}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;max-width:640px;width:100%;margin-inline:auto}
.back{width:46px;height:46px;flex:none;border-radius:12px;background:var(--surface);
  border:1.5px solid var(--gold);color:var(--gold);font-size:20px;display:grid;place-items:center}
[dir="rtl"] .back .arr{transform:scaleX(-1)}
.topbar h2{font-family:var(--ff-disp);font-size:22px;margin:0;letter-spacing:.06em}
.page{max-width:640px;width:100%;margin:0 auto;padding-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:13px}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:7px}
input[type=text]{width:100%;padding:13px 14px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);color:var(--txt);font-size:16px;font-family:inherit}
input:focus{border-color:var(--gold);outline:none}
.chips-row{display:flex;flex-wrap:wrap;gap:9px}
.pill{padding:10px 15px;border-radius:999px;background:var(--bg2);border:1.5px solid var(--line);font-size:14px}
.pill.sel{border-color:var(--gold);color:var(--gold)}
.swatch{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);position:relative}
.swatch.sel{border-color:var(--txt);transform:scale(1.08)}
.swatch::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--sw)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.toggle span{font-size:15px}
.sw{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw.on{background:var(--gold)}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:.2s}
.sw.on::after{inset-inline-start:25px}
.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.stat:last-child{border-bottom:none}
.stat b{color:var(--gold);font-variant-numeric:tabular-nums}
.hsrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.hsrow:last-child{border-bottom:none}
.hsrow .rk{width:26px;color:var(--muted);font-variant-numeric:tabular-nums}
.hsrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hsrow .sc{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.hsrow.me .nm{color:var(--gold)}
.about{text-align:center;padding:22px 0}
.about .ver{display:inline-block;padding:5px 13px;border-radius:999px;background:var(--bg2);
  border:1px solid var(--line);font-size:12.5px;color:var(--muted);margin-bottom:14px}
.about h3{font-family:var(--ff-disp);font-size:26px;color:var(--gold);margin:0 0 6px;letter-spacing:.08em}
.about p{color:var(--muted);font-size:14px;margin:5px 0}
.nest{margin-top:26px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.12em}
.nest b{color:var(--gold)}
.bestiary{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.bestiary:last-child{border-bottom:none}
.bestiary .em{font-size:26px;width:34px;text-align:center;flex:none}
.bestiary .nm{font-weight:600;font-size:15px}
.bestiary .ds{font-size:13px;color:var(--muted);line-height:1.6;margin-top:2px}

/* ===== game ===== */
#c3d{position:absolute;inset:0;display:block;touch-action:none}
#scan{position:absolute;inset:0;pointer-events:none;z-index:6;display:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0px,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px)}
#flash{position:absolute;inset:0;pointer-events:none;z-index:7;background:rgba(255,40,40,.42);opacity:0;transition:opacity .12s}
.hud{position:absolute;inset:0;pointer-events:none;z-index:8}
.hud>*{pointer-events:auto}
.hud-top{position:absolute;top:calc(var(--safe-t) + 10px);inset-inline:10px;display:flex;
  justify-content:space-between;align-items:flex-start;gap:8px}
.g-back{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);
  border:1.5px solid var(--gold);color:var(--gold);font-size:19px;display:grid;place-items:center;flex:none}
.gbox{background:rgba(0,0,0,.62);backdrop-filter:blur(8px);border:1px solid var(--gold-dim);
  border-radius:12px;padding:7px 14px;text-align:center;color:#fff;min-width:88px}
.gbox .k{font-size:9.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.gbox .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.gbox .x{font-size:11px;color:var(--gold-soft);min-height:13px}
.gcol{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chipline{background:rgba(0,0,0,.62);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:12px;color:#e8e8e8;white-space:nowrap}
#radar{position:absolute;inset-inline-start:10px;top:calc(var(--safe-t) + 92px);
  width:74px;height:104px;border-radius:8px;border:1.5px solid var(--gold-dim);
  background:rgba(0,0,0,.45);z-index:9}
#bossbar{position:absolute;top:calc(var(--safe-t) + 74px);inset-inline:0;margin:auto;
  width:min(300px,70vw);z-index:9;display:none}
#bossbar .lb{font-size:10px;color:var(--danger);text-align:center;letter-spacing:.2em;margin-bottom:3px}
#bossbar .ot{height:11px;background:rgba(0,0,0,.6);border:1.5px solid var(--danger);border-radius:5px;overflow:hidden}
#bossbar .in{height:100%;width:100%;background:linear-gradient(90deg,#8c1f16,var(--danger));transition:width .15s}

.msg{position:absolute;top:30%;inset-inline:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.msg.on{opacity:1}
.msg span{display:inline-block;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);
  border:1.5px solid var(--gold);border-radius:14px;padding:12px 24px;color:var(--gold-soft);
  font-family:var(--ff-disp);font-size:clamp(16px,4.4vw,26px);letter-spacing:.05em;max-width:88vw}
.kmsg{position:absolute;top:42%;inset-inline:0;text-align:center;pointer-events:none;opacity:0;
  transition:opacity .25s;color:var(--danger);font-weight:700;font-size:clamp(15px,4.4vw,26px);
  letter-spacing:.14em;text-shadow:0 0 14px rgba(200,80,63,.8)}
.kmsg.on{opacity:1}

/* touch controls */
#touch{position:absolute;inset:0;z-index:10;display:none;pointer-events:none}
#jz{position:absolute;inset-inline-start:14px;bottom:calc(var(--safe-b) + 16px);width:118px;height:118px;
  border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.18);pointer-events:auto}
#jk{position:absolute;left:31px;top:31px;width:56px;height:56px;border-radius:50%;
  background:rgba(212,175,55,.28);border:2px solid var(--gold);transition:transform .04s}
#fb{position:absolute;inset-inline-end:18px;bottom:calc(var(--safe-b) + 26px);width:82px;height:82px;
  border-radius:50%;background:rgba(212,175,55,.16);border:3px solid var(--gold);color:var(--gold-soft);
  font-size:12px;font-weight:700;display:grid;place-items:center;pointer-events:auto;letter-spacing:.08em}
#fb.act{background:rgba(212,175,55,.4)}
#bb{position:absolute;inset-inline-end:26px;bottom:calc(var(--safe-b) + 126px);width:60px;height:60px;
  border-radius:50%;background:rgba(200,80,63,.16);border:3px solid var(--danger);color:#f0b0a6;
  font-size:11px;font-weight:700;display:grid;place-items:center;pointer-events:auto}
#bb.act{background:rgba(200,80,63,.42)}
#bb .n{font-size:15px;line-height:1}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(6px);z-index:60;
  display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.ov-box{background:var(--surface);border:1.5px solid var(--gold);border-radius:18px;padding:24px;
  max-width:430px;width:100%;text-align:center;animation:pop .25s cubic-bezier(.2,1.2,.4,1);
  max-height:92vh;overflow-y:auto}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.ov-box .big{font-size:42px;margin-bottom:10px}
.ov-box h3{font-family:var(--ff-disp);font-size:21px;margin:0 0 9px;color:var(--gold)}
.ov-box p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0 0 18px}
.ov-row{display:flex;gap:10px}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.2s}
.dot.on{background:var(--gold);width:22px;border-radius:999px}
.bigscore{font-size:38px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.subscore{font-size:13.5px;color:var(--muted);margin-bottom:16px}
.toast{position:fixed;bottom:calc(var(--safe-b) + 22px);inset-inline:0;margin:auto;width:max-content;
  max-width:88vw;background:var(--surface);border:1px solid var(--gold);border-radius:999px;
  padding:12px 22px;color:var(--gold);font-size:14px;z-index:80;opacity:0;transition:.25s;
  transform:translateY(12px);pointer-events:none}
.toast.on{opacity:1;transform:none}
.hidden{display:none!important}
</style>
</head>
<body data-theme="gold" data-mode="dark">

<section class="screen on" id="s-home">
  <div class="quickbar">
    <button class="qb" id="qb-theme" aria-label="theme">🎨</button>
    <button class="qb" id="qb-mode" aria-label="mode">🌙</button>
    <button class="qb" id="qb-lang" aria-label="language">🌐</button>
  </div>
  <div class="stack-bar" id="home-best">—</div>
  <div class="brand">
    <div class="chip-mark"><span>🚀</span></div>
    <h1>STAR COOP</h1>
    <p id="t-tagline"></p>
  </div>
  <nav class="menu">
    <button class="btn primary" data-go="game"><span class="ico">🚀</span>
      <span><span class="lbl" id="t-play"></span><span class="sub" id="t-play-sub"></span></span></button>
    <button class="btn" data-go="stats"><span class="ico">🏆</span>
      <span><span class="lbl" id="t-stats"></span><span class="sub" id="t-stats-sub"></span></span></button>
    <button class="btn" data-go="guide"><span class="ico">📖</span>
      <span><span class="lbl" id="t-guide"></span><span class="sub" id="t-guide-sub"></span></span></button>
    <button class="btn" data-go="settings"><span class="ico">⚙️</span>
      <span><span class="lbl" id="t-settings"></span><span class="sub" id="t-settings-sub"></span></span></button>
    <button class="btn" data-go="about"><span class="ico">ℹ️</span>
      <span><span class="lbl" id="t-about"></span><span class="sub" id="t-about-sub"></span></span></button>
  </nav>
  <div class="nest">APP<b>NEST</b> · <span id="home-ver"></span></div>
</section>

<section class="screen game" id="s-game">
  <canvas id="c3d"></canvas>
  <div id="scan"></div>
  <div id="flash"></div>
  <canvas id="radar" width="74" height="104"></canvas>
  <div id="bossbar"><div class="lb" id="t-boss">BOSS</div><div class="ot"><div class="in" id="boss-in"></div></div></div>
  <div class="hud">
    <div class="hud-top">
      <button class="g-back" data-go="home"><span class="arr">←</span></button>
      <div class="gbox"><div class="k" id="t-score"></div><div class="v" id="hud-score">0</div><div class="x" id="hud-combo"></div></div>
      <div class="gcol">
        <div class="chipline" id="hud-wave"></div>
        <div class="chipline" id="hud-lives"></div>
        <div class="chipline" id="hud-weapon"></div>
        <div class="chipline" id="hud-mission"></div>
      </div>
    </div>
    <div class="msg" id="hud-msg"><span></span></div>
    <div class="kmsg" id="hud-kmsg"></div>
  </div>
  <div id="touch">
    <div id="jz"><div id="jk"></div></div>
    <div id="fb"><span id="t-fire"></span></div>
    <div id="bb"><span><span class="n" id="bb-n">3</span><br>💥</span></div>
  </div>
</section>

<section class="screen" id="s-stats">
  <div class="topbar"><button class="back" data-go="home"><span class="arr">←</span></button><h2 id="t-stats2"></h2></div>
  <div class="page">
    <div class="card"><h3 id="t-hs-title"></h3><div id="hs-list"></div></div>
    <div class="card"><h3 id="t-rec-title"></h3><div id="stats-list"></div></div>
    <button class="btn wide danger" id="b-reset-stats"><span class="lbl" id="t-reset-stats"></span></button>
  </div>
</section>

<section class="screen" id="s-guide">
  <div class="topbar"><button class="back" data-go="home"><span class="arr">←</span></button><h2 id="t-guide2"></h2></div>
  <div class="page" id="guide-body"></div>
</section>

<section class="screen" id="s-set">
  <div class="topbar"><button class="back" data-go="home"><span class="arr">←</span></button><h2 id="t-set2"></h2></div>
  <div class="page">
    <div class="card"><h3 id="t-profile"></h3>
      <div class="field"><label id="t-username"></label><input type="text" id="i-name" maxlength="20"></div>
    </div>
    <div class="card"><h3 id="t-gameplay"></h3>
      <div class="field"><label id="t-difficulty"></label><div class="chips-row" id="diff-row"></div></div>
      <div class="toggle"><span id="t-autofire"></span><button class="sw on" id="sw-auto"></button></div>
      <div class="toggle"><span id="t-shake"></span><button class="sw on" id="sw-shake"></button></div>
    </div>
    <div class="card"><h3 id="t-language"></h3><div class="chips-row" id="lang-row"></div></div>
    <div class="card"><h3 id="t-theme"></h3>
      <div class="chips-row" id="theme-row" style="margin-bottom:14px"></div>
      <div class="toggle"><span id="t-darkmode"></span><button class="sw on" id="sw-mode"></button></div>
      <div class="toggle"><span id="t-sound"></span><button class="sw on" id="sw-sound"></button></div>
      <div class="toggle"><span id="t-music"></span><button class="sw on" id="sw-music"></button></div>
      <div class="toggle"><span id="t-crt"></span><button class="sw" id="sw-crt"></button></div>
    </div>
    <div class="card"><h3 id="t-data"></h3>
      <button class="btn wide" id="b-export" style="margin-bottom:10px"><span class="lbl" id="t-export"></span></button>
      <button class="btn wide" id="b-import" style="margin-bottom:10px"><span class="lbl" id="t-import"></span></button>
      <button class="btn wide danger" id="b-wipe"><span class="lbl" id="t-wipe"></span></button>
      <input type="file" id="file-in" accept="application/json" class="hidden">
    </div>
  </div>
</section>

<section class="screen" id="s-about">
  <div class="topbar"><button class="back" data-go="home"><span class="arr">←</span></button><h2 id="t-about2"></h2></div>

<script>
"use strict";
/* ================= STATE + STORAGE ================= */
const KEY = "appnest.starcoop.v1";
const DEFAULTS = {
  name:"", lang:"he", theme:"gold", mode:"dark",
  sound:true, music:true, crt:false, autofire:true, shake:true,
  diff:"normal", seenTutorial:false, scores:[],
  stats:{games:0, best:0, wave:0, kills:0, time:0, combo:0}
};
let S = JSON.parse(JSON.stringify(DEFAULTS));

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), d);
      S.stats  = Object.assign({}, DEFAULTS.stats, d.stats || {});
      S.scores = Array.isArray(d.scores) ? d.scores : [];
    }
  }catch(e){ console.warn("load failed", e); }
}
let saveWarned = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(!saveWarned){ saveWarned = true; toast(T("t_savef")); } }
}

/* ================= I18N ================= */
function T(k, vars){
  const L = LANG[S.lang] || LANG.en;
  let s = (k in L) ? L[k] : (LANG.en[k] !== undefined ? LANG.en[k] : k);
  if(vars) for(const v in vars) s = s.split("{"+v+"}").join(vars[v]);
  return s;
}
function myName(){ return S.name.trim() || T("guest"); }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOC = {he:"he-IL", ar:"ar-EG", ru:"ru-RU", es:"es-ES", en:"en-US"};
const fmt = n => Math.round(n).toLocaleString(LOC[S.lang] || "en-US");
function mmss(sec){
  const m = Math.floor(sec/60), s2 = Math.floor(sec%60);
  return m + ":" + String(s2).padStart(2,"0");
}

function applyLang(){
  const L = LANG[S.lang] || LANG.en;
  document.documentElement.lang = S.lang;
  document.documentElement.dir = L.dir;
  const set = (id,v)=>{ const e = $(id); if(e) e.textContent = v; };
  set("t-tagline",T("tagline"));
  set("t-play",T("play")); set("t-play-sub",T("play_sub"));
  set("t-stats",T("stats")); set("t-stats-sub",T("stats_sub"));
  set("t-guide",T("guide")); set("t-guide-sub",T("guide_sub"));
  set("t-settings",T("settings")); set("t-settings-sub",T("settings_sub"));
  set("t-about",T("about")); set("t-about-sub",T("about_sub"));
  set("t-score",T("score")); set("t-boss",T("boss")); set("t-fire",T("fire"));
  set("t-stats2",T("stats")); set("t-hs-title",T("hs_title")); set("t-rec-title",T("rec_title"));
  set("t-reset-stats",T("reset_stats"));
  set("t-guide2",T("guide_title")); set("t-set2",T("set_title")); set("t-about2",T("about_title"));
  set("t-profile",T("profile")); set("t-username",T("username"));
  set("t-gameplay",T("gameplay")); set("t-difficulty",T("difficulty"));
  set("t-autofire",T("autofire")); set("t-shake",T("shake"));
  set("t-language",T("language")); set("t-theme",T("theme"));
  set("t-darkmode",T("darkmode")); set("t-sound",T("sound"));

  if(G.running) syncHUD();
}
function applyTheme(){
  document.body.dataset.theme = S.theme;
  document.body.dataset.mode = S.mode;
  const mc = document.querySelector('meta[name=theme-color]');
  if(mc) mc.setAttribute("content", S.mode === "light" ? "#f4f1e8" : "#080808");
  const qb = $("qb-mode"); if(qb) qb.textContent = S.mode === "dark" ? "🌙" : "☀️";
  $("scan").style.display = S.crt ? "block" : "none";
  if(scene) applyTheme3D();
}

/* ================= NAVIGATION ================= */
const SCREENS = {home:"s-home", game:"s-game", stats:"s-stats", guide:"s-guide", settings:"s-set", about:"s-about"};
let current = "home";
function go(name){
  if(name === current) return;
  if(current === "game" && name !== "game") stopGame();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(SCREENS[name]).classList.add("on");
  current = name;
  if(name === "game") startGame();
  if(name === "stats") buildStats();
  if(name === "home") refreshHome();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-go]");
  if(b){ blip(560,.03); go(b.dataset.go); }
});
function refreshHome(){ $("home-best").textContent = "🏆 " + fmt(S.stats.best); }

/* ================= TOAST ================= */
let toastT;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 2600);
}

/* ================= AUDIO ================= */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type, vol){
  if(!S.sound) return; const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .05, c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + (dur || .1));
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + (dur || .1) + .02);
}
function noise(dur, vol, curve){
  if(!S.sound) return; const c = ac(); if(!c) return;
  const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, curve || 1);
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = vol || .12;
  src.connect(g); g.connect(c.destination); src.start();
}
const sfxShot   = ()=>tone(1150 + Math.random()*120, .05, "square", .026);
const sfxLaser  = ()=>tone(240, .06, "sawtooth", .02);
const sfxEShot  = ()=>tone(300, .09, "sawtooth", .025);
const sfxHit    = ()=>tone(170, .07, "square", .03);
const sfxBoom   = ()=>noise(.26, .11, 1);
const sfxBigBoom= ()=>noise(.55, .2, .5);
const sfxPup    = ()=>{ [520,700,930].forEach((f,i)=>setTimeout(()=>tone(f,.1,"sine",.06), i*70)); };
const sfxCombo  = ()=>{ tone(680,.06,"sine",.055); setTimeout(()=>tone(1090,.09,"sine",.055), 85); };
const sfxHurt   = ()=>{ noise(.3,.16,1); tone(120,.22,"sawtooth",.05); };
const sfxBoss   = ()=>{ tone(150,.35,"sawtooth",.07); setTimeout(()=>tone(112,.4,"sawtooth",.07), 340); };
const sfxMsn    = ()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16,"sine",.06), i*90)); };

/* simple two-bar loop, mirrors the arcade feel without any audio files */
const MEL_A = [440,0,523,0,587,0,523,0,440,0,392,0,349,0,392,0];
const MEL_B = [523,0,587,0,659,0,587,0,523,0,494,0,440,0,494,0];
const BASS  = [110,110,82,82,98,98,73,73];
let musicTimer = null, mIdx = 0, useB = false;
function musicOn(){
  if(musicTimer || !S.music) return; mIdx = 0; useB = false;
  musicTimer = setInterval(()=>{
    if(G.state !== "playing" || !S.music) return;
    const mel = useB ? MEL_B : MEL_A, f = mel[mIdx % mel.length];
    if(f) tone(f, .14, "triangle", .022);
    tone(BASS[mIdx % BASS.length], .17, "sine", .019);
    if(mIdx % 2 === 0) noise(.05, .045, 2);
    mIdx++; if(mIdx % 32 === 0) useB = !useB;
  }, 155);
}
function musicOff(){ if(musicTimer){ clearInterval(musicTimer); musicTimer = null; } }
const blip = (f,d)=>tone(f, d || .04, "sine", .05);

function buildSettings(){

    b.className = "pill" + (S.diff === d ? " sel" : "");

    b.onclick = ()=>{ S.diff = d; save(); buildSettings(); blip(700); };
    dr.appendChild(b);
  });
  const lr = $("lang-row"); lr.innerHTML = "";
  LANG_ORDER.forEach(code=>{
    const b = document.createElement("button");
    b.className = "pill" + (S.lang === code ? " sel" : "");
    b.textContent = LANG[code].name;
    b.onclick = ()=>{ S.lang = code; save(); applyLang(); blip(700); };

  const tr = $("theme-row"); tr.innerHTML = "";

    b.className = "swatch" + (S.theme === k ? " sel" : "");
    b.style.setProperty("--sw", SW[k]);
    b.title = T("th_"+k); b.setAttribute("aria-label", T("th_"+k));
    b.onclick = ()=>{ S.theme = k; save(); applyTheme(); buildSettings(); blip(760); };
    tr.appendChild(b);
  });
  $("sw-mode").classList.toggle("on", S.mode === "dark");
  $("sw-sound").classList.toggle("on", S.sound);
  $("sw-music").classList.toggle("on", S.music);
  $("sw-crt").classList.toggle("on", S.crt);
  $("sw-auto").classList.toggle("on", S.autofire);
  $("sw-shake").classList.toggle("on", S.shake);
}
$("i-name").addEventListener("input", e=>{ S.name = e.target.value; save(); });
function tog(id, key, after){

}

tog("sw-auto", "autofire");
tog("sw-shake", "shake");

$("qb-theme").onclick = ()=>{
  const ks = ["gold","blue","emerald","purple","crimson"];

};

  S.lang = LANG_ORDER[(LANG_ORDER.indexOf(S.lang)+1) % LANG_ORDER.length];

/* ================= GUIDE / STATS ================= */
const BESTIARY = [

  const b = $("guide-body"); b.innerHTML = "";
  for(let i=1;i<=6;i++){
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = '<h3>'+icons[i-1]+' '+esc(T("g"+i+"t"))+'</h3>'+
      '<p style="margin:0;color:var(--muted);line-height:1.75;font-size:14.5px">'+esc(T("g"+i+"d"))+'</p>';
    b.appendChild(d);
  }
  const bs = document.createElement("div");
  bs.className = "card";
  bs.innerHTML = '<h3>👾 '+esc(T("bestiary"))+'</h3>' + BESTIARY.map(([em,k])=>
    '<div class="bestiary"><div class="em">'+em+'</div><div><div class="nm">'+esc(T(k))+
    '</div><div class="ds">'+esc(T(k+"_d"))+'</div></div></div>').join("");
  b.appendChild(bs);
}
function buildStats(){
  const list = $("hs-list");
  if(!S.scores.length){
    list.innerHTML = '<div class="hsrow"><span class="nm" style="color:var(--muted)">'+esc(T("st_none"))+'</span></div>';
  }else{
    list.innerHTML = S.scores.slice(0,10).map((e,i)=>
      '<div class="hsrow'+(e.mine?" me":"")+'"><span class="rk">'+(i+1)+'</span>'+
      '<span class="nm">'+esc(e.name)+'</span>'+
      '<span class="sc">'+esc(fmt(e.score))+'</span></div>').join("");
  }
  const st = S.stats;
  const rows = [[T("st_games"),fmt(st.games)],[T("st_best"),fmt(st.best)],
                [T("st_wave"),fmt(st.wave)],[T("st_kills"),fmt(st.kills)],
                [T("st_combo"),"x"+fmt(st.combo)],[T("st_time"),mmss(st.time)]];
  $("stats-list").innerHTML = rows.map(r=>
    '<div class="stat"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>').join("");
}
function addScore(score, wave){
  const entry = {name:myName(), score:Math.round(score), wave:wave, diff:S.diff,
                 date:new Date().toISOString().slice(0,10), mine:true};
  S.scores.forEach(e=>{ e.mine = false; });
  S.scores.push(entry);
  S.scores.sort((a,b)=>b.score - a.score);
  S.scores = S.scores.slice(0, 10);
  save();
  return S.scores.indexOf(entry);
}

/* ================= OVERLAYS ================= */
let askYes = null;
function ask(title, desc, onYes){
  $("ask-title").textContent = title; $("ask-desc").textContent = desc;
  $("ask-no").querySelector(".lbl").textContent = T("no");
  $("ask-yes").querySelector(".lbl").textContent = T("yes");
  askYes = onYes; $("ov-ask").classList.add("on");
}
$("ask-no").onclick = ()=>$("ov-ask").classList.remove("on");
$("ask-yes").onclick = ()=>{ $("ov-ask").classList.remove("on"); if(askYes) askYes(); };

let tutStep = 0;
function openTutorial(){ tutStep = 0; renderTut(); $("ov-tut").classList.add("on"); }
function renderTut(){
  const icons = ["🎯","🕹️","⚡","🔥","💥","👑"];
  $("tut-ico").textContent = icons[tutStep];
  $("tut-title").textContent = T("g"+(tutStep+1)+"t");
  $("tut-desc").textContent  = T("g"+(tutStep+1)+"d");
  $("tut-dots").innerHTML = icons.map((_,i)=>'<div class="dot'+(i===tutStep?" on":"")+'"></div>').join("");
  $("tut-skip").querySelector(".lbl").textContent = T("skip");
  $("tut-next").querySelector(".lbl").textContent = tutStep === 5 ? T("start") : T("next");
}
$("tut-next").onclick = ()=>{ if(tutStep < 5){ tutStep++; renderTut(); blip(700); } else closeTut(); };
$("tut-skip").onclick = closeTut;
function closeTut(){ $("ov-tut").classList.remove("on"); S.seenTutorial = true; save(); }

/* ================= DATA ================= */
$("b-export").onclick = ()=>{
  const payload = {app:"AppNest Star Coop", version:VERSION, user:myName(),
                   exportedAt:new Date().toISOString(), data:S};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "starcoop-" + myName().replace(/\s+/g,"_") + "-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast(T("t_exp"));
};
$("b-import").onclick = ()=>$("file-in").click();
$("file-in").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const p = JSON.parse(r.result), d = p.data || p;
      if(!d || typeof d !== "object" || !d.stats) throw new Error("bad");
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), d);
      S.stats  = Object.assign({}, DEFAULTS.stats, d.stats || {});
      S.scores = Array.isArray(d.scores) ? d.scores : [];
      save(); applyTheme(); applyLang(); toast(T("t_imp"));
    }catch(err){ toast(T("t_impf")); }
  };
  r.onerror = ()=>toast(T("t_impf"));
  r.readAsText(f); e.target.value = "";
};
$("b-wipe").onclick = ()=> ask(T("ask_wipe_t"), T("ask_wipe_d"), ()=>{
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = JSON.parse(JSON.stringify(DEFAULTS));
  save(); applyTheme(); applyLang(); go("home");
});
$("b-reset-stats").onclick = ()=> ask(T("ask_res_t"), T("ask_res_d"), ()=>{
  S.scores = []; S.stats = Object.assign({}, DEFAULTS.stats);
  save(); buildStats(); refreshHome();
});
$("b-share").onclick = async ()=>{
  const url = location.href.split("#")[0], text = myName() + " — Star Coop · AppNest";
  if(navigator.share){ try{ await navigator.share({title:"Star Coop", text, url}); return; }
    catch(e){ if(e.name === "AbortError") return; } }
  try{ await navigator.clipboard.writeText(text + "\n" + url); toast(T("t_copy")); }
  catch(e){ toast(url); }
};

<script>
"use strict";
/* =========================================================================
   3D WORLD — models, pools, starfield, nebula
   ========================================================================= */
const THEME3D = {
  gold:   {accent:0xd4af37, glow:0xffd98a, bolt:0xffc14d, sky:0x05040a, neb:"#6b5410", star:0xfff3d0},
  blue:   {accent:0x5aa2e0, glow:0xbcd9ff, bolt:0x7fd0ff, sky:0x030812, neb:"#134a7a", star:0xdfeeff},
  emerald:{accent:0x3fd39a, glow:0xbdf5da, bolt:0x6effc0, sky:0x02100c, neb:"#0f5c42", star:0xd6ffee},
  purple: {accent:0xa97ce0, glow:0xe2ccff, bolt:0xc79bff, sky:0x080418, neb:"#4a2a80", star:0xefe0ff},
  crimson:{accent:0xe0645c, glow:0xffc9c2, bolt:0xff8a7a, sky:0x120404, neb:"#7a2620", star:0xffe0da}
};
const PLAYER_Z = 4, SPAWN_Z = -125, DESPAWN_Z = 15;

/* enemy stats — hp, score, speed, radius, fire interval (s), contact damage, drop chance */
const ET = {
  chick:  {hp:1, sc:60,  spd:27, r:0.95, fire:0,   drop:.05},
  hen:    {hp:2, sc:110, spd:17, r:1.30, fire:2.6, drop:.11},
  rooster:{hp:4, sc:230, spd:15, r:1.60, fire:2.2, drop:.16},
  ufo:    {hp:3, sc:200, spd:19, r:1.35, fire:1.9, drop:.14},
  squid:  {hp:3, sc:250, spd:21, r:1.25, fire:2.4, drop:.15},
  drone:  {hp:6, sc:350, spd:14, r:1.45, fire:1.5, drop:.20},
  mine:   {hp:1, sc:80,  spd:11, r:1.15, fire:0,   drop:.05},
  rock:   {hp:3, sc:70,  spd:16, r:1.70, fire:0,   drop:.04}
};
const BOSSES = [
  {id:"hen",  key:"b_hen",  hp:45, sc:3000, r:4.6, fire:1.5},
  {id:"ship", key:"b_ship", hp:55, sc:5000, r:5.4, fire:1.2},
  {id:"core", key:"b_core", hp:65, sc:8000, r:4.8, fire:1.0}
];
const DIFF = {
  easy:   {hp:.75, fireMul:1.7, espd:.82, pcd:.14, lives:5, bombs:4, drop:1.6, pace:.75},
  normal: {hp:1,   fireMul:1,   espd:1,   pcd:.17, lives:3, bombs:3, drop:1,   pace:1},
  hard:   {hp:1.4, fireMul:.68, espd:1.24,pcd:.19, lives:2, bombs:2, drop:.7,  pace:1.3}
};
const WEAPONS = {
  normal:{key:"w_normal", cd:1,   dmg:1},
  double:{key:"w_double", cd:.95, dmg:1},
  spread:{key:"w_spread", cd:1.15,dmg:1},
  laser: {key:"w_laser",  cd:.42, dmg:1},
  homing:{key:"w_homing", cd:1.3, dmg:2}
};
const PUP_COLORS = {double:0xffd24a, spread:0x66ff9e, laser:0xff5ad0, homing:0x63c8ff, shield:0x8ad4ff, bomb:0xff7a4a, life:0x7dff7d};

let scene, camera, renderer, raf = 0, clock = null;
let starPoints, starVel, nebulas = [], ship = null, shieldMesh = null;
let accentMat, boltMat, glowMat;
let BX = 8, BY = 11;

/* ---------- tiny helpers ---------- */
const mat = (c, opts) => new THREE.MeshPhongMaterial(Object.assign({color:c}, opts||{}));
const emat = (c, i) => new THREE.MeshPhongMaterial({color:c, emissive:c, emissiveIntensity:i===undefined?.75:i});
function mesh(geo, m, x, y, z){ const o = new THREE.Mesh(geo, m); o.position.set(x||0, y||0, z||0); return o; }
function disposeObj(o){
  o.traverse(c=>{
    if(c.isMesh || c.isPoints){
      if(c.geometry) c.geometry.dispose();
      const ms = Array.isArray(c.material) ? c.material : [c.material];
      ms.forEach(m=>{ if(m) m.dispose(); });
    }
  });
  if(o.parent) o.parent.remove(o);
}

/* ---------- player ship ---------- */
function makeShip(){
  const g = new THREE.Group();
  const c = THEME3D[S.theme] || THEME3D.gold;
  const hull = mat(0xdfe4ea, {shininess:70}), trim = mat(c.accent, {shininess:90});
  const glass = new THREE.MeshPhongMaterial({color:0x7fd0ff, emissive:0x1a5f8a, transparent:true, opacity:.75});
  const nose = mesh(new THREE.ConeGeometry(.52, 2.0, 14), hull, 0, 0, -1.5);
  nose.rotation.x = -Math.PI/2; g.add(nose);
  g.add(mesh(new THREE.CylinderGeometry(.52, .62, 2.0, 14), hull, 0, 0, .1).rotateX(Math.PI/2));
  const cock = mesh(new THREE.SphereGeometry(.42, 14, 10), glass, 0, .3, -.35);
  cock.scale.set(.85, .62, 1.35); g.add(cock);
  [-1, 1].forEach(s=>{
    const w = mesh(new THREE.BoxGeometry(1.75, .13, 1.0), trim, s*1.15, -.05, .3);
    w.rotation.z = s * .16; w.rotation.y = -s * .30; g.add(w);
    const tip = mesh(new THREE.ConeGeometry(.16, .7, 8), trim, s*1.95, -.05, -.15);
    tip.rotation.x = -Math.PI/2; g.add(tip);
    const eng = mesh(new THREE.CylinderGeometry(.26, .3, .95, 10), mat(0x555b63), s*.68, -.12, 1.05);
    eng.rotation.x = Math.PI/2; g.add(eng);
    const fire = mesh(new THREE.ConeGeometry(.24, .95, 10), emat(c.glow, 1.1), s*.68, -.12, 1.75);
    fire.rotation.x = Math.PI/2; g.add(fire); g.userData["fire"+(s>0?1:0)] = fire;
  });
  const fin = mesh(new THREE.BoxGeometry(.12, .8, .9), trim, 0, .5, .75); g.add(fin);
  g.traverse(o=>{ if(o.isMesh){ o.castShadow = false; o.receiveShadow = false; } });
  return g;
}

/* ---------- chickens ---------- */
function makeBird(kind){
  const g = new THREE.Group();
  const sizes = {chick:.62, hen:1.0, rooster:1.32};
  const body = {chick:0xffe066, hen:0xfaf6ee, rooster:0xc8763a}[kind];
  const sc = sizes[kind];
  const bodyM = mat(body, {shininess:12}), beakM = mat(0xff9a1f), legM = mat(0xffa733);
  const tor = mesh(new THREE.SphereGeometry(.85, 16, 12), bodyM, 0, 0, .15);
  tor.scale.set(1, .92, 1.15); g.add(tor);
  const head = mesh(new THREE.SphereGeometry(.5, 14, 11), bodyM, 0, .62, -.55); g.add(head);
  const beak = mesh(new THREE.ConeGeometry(.19, .5, 8), beakM, 0, .55, -1.0);
  beak.rotation.x = -Math.PI/2; g.add(beak);
  [-1,1].forEach(s=>{
    const eye = mesh(new THREE.SphereGeometry(.1, 8, 6), mat(0x18140f), s*.24, .74, -.85); g.add(eye);
  });
  if(kind !== "chick"){
    const combM = mat(0xd93a2b);
    const n = kind === "rooster" ? 4 : 3;
    for(let i=0;i<n;i++){
      const cb = mesh(new THREE.SphereGeometry(.15 + (kind==="rooster"?.05:0), 8, 6), combM,
        0, .98 + Math.sin(i/n*Math.PI)*.12, -.72 + i*.2);
      cb.scale.set(.55, 1.1, .8); g.add(cb);
    }
    const wat = mesh(new THREE.SphereGeometry(.14, 8, 6), combM, 0, .34, -.86);
    wat.scale.set(.7, 1.2, .7); g.add(wat);
  }
  const wings = [];
  [-1,1].forEach(s=>{
    const w = mesh(new THREE.BoxGeometry(1.15, .12, .82), bodyM, s*.9, .12, .12);
    w.rotation.z = s * .2; g.add(w); wings.push(w);
  });
  g.userData.wings = wings;
  const tail = mesh(new THREE.ConeGeometry(.42, .9, 6), bodyM, 0, .3, 1.05);
  tail.rotation.x = -1.9; g.add(tail);
  [-1,1].forEach(s=>{
    const leg = mesh(new THREE.CylinderGeometry(.07, .07, .5, 6), legM, s*.28, -.8, .1); g.add(leg);
  });
  g.scale.setScalar(sc);
  return g;
}

/* ---------- aliens and machines ---------- */
function makeUFO(){
  const g = new THREE.Group(); const c = THEME3D[S.theme] || THEME3D.gold;
  g.add(mesh(new THREE.CylinderGeometry(1.35, .55, .3, 20), mat(0x8c93a3, {shininess:80}), 0, 0, 0));
  g.add(mesh(new THREE.CylinderGeometry(.55, 1.35, .3, 20), mat(0x6f7684, {shininess:80}), 0, -.3, 0));
  const dome = mesh(new THREE.SphereGeometry(.62, 14, 9, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshPhongMaterial({color:0x9ef0a8, emissive:0x2fa04a, transparent:true, opacity:.8}), 0, .12, 0);
  g.add(dome);
  const lights = [];
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    const L = mesh(new THREE.SphereGeometry(.13, 8, 6), emat(c.glow, 1), Math.cos(a)*1.1, -.12, Math.sin(a)*1.1);
    g.add(L); lights.push(L);
  }
  g.userData.lights = lights;
  return g;
}
function makeSquid(){
  const g = new THREE.Group();
  const skin = new THREE.MeshPhongMaterial({color:0xb455d6, emissive:0x3d1055, emissiveIntensity:.5, shininess:40});
  const head = mesh(new THREE.SphereGeometry(.78, 14, 11), skin, 0, 0, -.25);
  head.scale.set(1, 1.05, 1.35); g.add(head);
  [-1,1].forEach(s=>{
    const e = mesh(new THREE.SphereGeometry(.19, 8, 6), emat(0xffe24a, .9), s*.4, .18, -.85); g.add(e);
  });
  const arms = [];
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    const t = mesh(new THREE.CylinderGeometry(.11, .04, 1.5, 6), skin,
      Math.cos(a)*.42, Math.sin(a)*.42, .95);
    t.rotation.x = Math.PI/2 + .12; g.add(t); arms.push({m:t, a:a});
  }
  g.userData.arms = arms;
  return g;
}
function makeDrone(){
  const g = new THREE.Group();
  const body = mat(0x59606b, {shininess:90}), dark = mat(0x2b2f36);
  g.add(mesh(new THREE.BoxGeometry(1.25, .7, 1.5), body));
  g.add(mesh(new THREE.BoxGeometry(1.55, .28, .5), dark, 0, 0, -.6));
  const eye = mesh(new THREE.SphereGeometry(.24, 10, 8), emat(0xff3a2a, 1.2), 0, .12, -.82); g.add(eye);
  g.userData.eye = eye;
  const rings = [];
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(p=>{
    g.add(mesh(new THREE.CylinderGeometry(.09, .09, .8, 6), dark, p[0]*.72, 0, p[1]*.7).rotateZ(Math.PI/2));
    const r = mesh(new THREE.TorusGeometry(.34, .06, 6, 14), body, p[0]*1.05, 0, p[1]*.7);
    r.rotation.x = Math.PI/2; g.add(r); rings.push(r);
  });
  g.userData.rings = rings;
  return g;
}
function makeMine(){
  const g = new THREE.Group();
  const shell = mat(0xf2ead6, {shininess:30});
  const egg = mesh(new THREE.SphereGeometry(.8, 14, 11), shell);
  egg.scale.set(.86, 1.2, .86); g.add(egg);
  const led = mesh(new THREE.SphereGeometry(.2, 8, 6), emat(0xff2a2a, 1.4), 0, 1.0, 0);
  g.add(led); g.userData.led = led;
  for(let i=0;i<8;i++){
    const a = i/8*Math.PI*2;
    const sp = mesh(new THREE.ConeGeometry(.13, .42, 5), mat(0x8d8577), Math.cos(a)*.78, 0, Math.sin(a)*.78);
    sp.rotation.z = -Math.PI/2; sp.rotation.y = -a; g.add(sp);
  }
  return g;
}
function makeRock(scale){
  const g = new THREE.Group();
  const r = mesh(new THREE.DodecahedronGeometry(1.05*(scale||1), 0), mat(0x8a8378, {flatShading:true, shininess:5}));
  r.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3); g.add(r);
  const b = mesh(new THREE.DodecahedronGeometry(.5*(scale||1), 0), mat(0x6f695f, {flatShading:true, shininess:5}), .7*(scale||1), .3*(scale||1), .1);
  g.add(b);
  return g;
}
function makeEnemyMesh(type, scale){
  if(type === "chick" || type === "hen" || type === "rooster") return makeBird(type);
  if(type === "ufo")   return makeUFO();
  if(type === "squid") return makeSquid();
  if(type === "drone") return makeDrone();
  if(type === "mine")  return makeMine();
  return makeRock(scale);
}

/* ---------- bosses ---------- */
function makeBoss(id){
  const g = new THREE.Group(); const c = THEME3D[S.theme] || THEME3D.gold;
  if(id === "hen"){
    const bird = makeBird("rooster"); bird.scale.setScalar(3.4); g.add(bird);
    const crown = mesh(new THREE.TorusGeometry(1.2, .18, 8, 18), emat(c.accent, .7), 0, 3.6, -1.9);
    crown.rotation.x = Math.PI/2; g.add(crown); g.userData.spin = crown;
    [-1,1].forEach(s=>{
      const gun = mesh(new THREE.CylinderGeometry(.3, .36, 2.2, 10), mat(0x4a4a4a), s*3.3, -.3, -1.2);
      gun.rotation.x = Math.PI/2; g.add(gun);
    });
  }else if(id === "ship"){
    g.add(mesh(new THREE.CylinderGeometry(4.6, 1.8, .9, 26), mat(0x8c93a3, {shininess:90})));
    g.add(mesh(new THREE.CylinderGeometry(1.8, 4.6, .9, 26), mat(0x686f7c, {shininess:90}), 0, -.9, 0));
    const dome = mesh(new THREE.SphereGeometry(1.9, 18, 12, 0, Math.PI*2, 0, Math.PI/2),
      new THREE.MeshPhongMaterial({color:0x9ef0a8, emissive:0x2fa04a, emissiveIntensity:.6, transparent:true, opacity:.85}), 0, .4, 0);
    g.add(dome);
    const ring = mesh(new THREE.TorusGeometry(3.4, .22, 8, 28), emat(c.accent, .6), 0, -.2, 0);
    ring.rotation.x = Math.PI/2; g.add(ring); g.userData.spin = ring;
    for(let i=0;i<5;i++){
      const a = i/5*Math.PI*2;
      g.add(mesh(new THREE.CylinderGeometry(.26, .3, 1.6, 8), mat(0x3d434c), Math.cos(a)*2.7, -1.1, Math.sin(a)*2.7).rotateX(Math.PI/2));
    }
  }else{
    const core = mesh(new THREE.IcosahedronGeometry(2.1, 1), emat(0xff5a2a, 1.1)); g.add(core);
    g.userData.core = core;
    const shell = mesh(new THREE.IcosahedronGeometry(3.0, 1),
      new THREE.MeshPhongMaterial({color:0x4b525c, flatShading:true, transparent:true, opacity:.55, shininess:70}));
    g.add(shell); g.userData.spin = shell;
    [0,1,2].forEach(i=>{
      const r = mesh(new THREE.TorusGeometry(3.9, .2, 8, 30), emat(c.accent, .55));
      r.rotation.x = i * 1.1; r.rotation.y = i * .8; g.add(r);
      if(i === 0) g.userData.ring0 = r; if(i === 1) g.userData.ring1 = r; if(i === 2) g.userData.ring2 = r;
    });
  }
  return g;
}

/* ---------- pools ---------- */
const PB = [], EB = [], PARTS = [];
const PB_MAX = 90, EB_MAX = 110, PART_MAX = 300;
function buildPools(){
  const c = THEME3D[S.theme] || THEME3D.gold;
  boltMat = emat(c.bolt, 1.2);
  const pbGeo = new THREE.BoxGeometry(.16, .16, 1.25);
  for(let i=0;i<PB_MAX;i++){
    const m = new THREE.Mesh(pbGeo, boltMat); m.visible = false; scene.add(m);
    PB.push({m, on:false, vx:0, vy:0, vz:0, dmg:1, homing:false, life:0});
  }
  const ebMat = emat(0xff4d3a, 1.1), ebGeo = new THREE.SphereGeometry(.26, 8, 6);
  const eggMat = emat(0xfff4d8, .55), eggGeo = new THREE.SphereGeometry(.26, 8, 6);
  for(let i=0;i<EB_MAX;i++){
    const m = new THREE.Mesh(i % 2 ? ebGeo : eggGeo, i % 2 ? ebMat : eggMat);
    m.visible = false; scene.add(m);
    EB.push({m, on:false, vx:0, vy:0, vz:0, life:0, egg:(i % 2) === 0});
  }
  const partGeo = new THREE.BoxGeometry(.24, .24, .24);
  for(let i=0;i<PART_MAX;i++){
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({color:0xffa030, transparent:true, opacity:1}));
    m.visible = false; scene.add(m);
    PARTS.push({m, on:false, vx:0, vy:0, vz:0, life:0, max:1});
  }
}
function takePB(){ for(let i=0;i<PB.length;i++) if(!PB[i].on) return PB[i]; return null; }
function takeEB(egg){
  for(let i=0;i<EB.length;i++) if(!EB[i].on && EB[i].egg === !!egg) return EB[i];
  for(let i=0;i<EB.length;i++) if(!EB[i].on) return EB[i];
  return null;
}
function burst(x, y, z, color, big){
  const n = big ? 26 : 11, spd = big ? 22 : 12;
  for(let k=0;k<n;k++){
    let p = null;
    for(let i=0;i<PARTS.length;i++) if(!PARTS[i].on){ p = PARTS[i]; break; }
    if(!p) return;
    p.on = true; p.m.visible = true;
    p.m.position.set(x, y, z);
    p.m.scale.setScalar(big ? 1.7 : 1);
    p.m.material.color.setHex(color);
    p.m.material.opacity = 1;
    const a = Math.random()*Math.PI*2, b = (Math.random()-.5)*Math.PI;
    const s = spd * (.35 + Math.random()*.75);
    p.vx = Math.cos(a)*Math.cos(b)*s; p.vy = Math.sin(b)*s; p.vz = Math.sin(a)*Math.cos(b)*s;
    p.life = p.max = big ? .95 : .55;
  }
  if(S.shake) shake = Math.max(shake, big ? .55 : .22);
}

/* ---------- starfield and nebula ---------- */
function buildStars(){
  const c = THEME3D[S.theme] || THEME3D.gold;
  const N = 1100, pos = new Float32Array(N*3);
  starVel = new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]   = (Math.random()-.5)*180;
    pos[i*3+1] = (Math.random()-.5)*120;
    pos[i*3+2] = -Math.random()*220 + 20;
    starVel[i] = 18 + Math.random()*46;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  starPoints = new THREE.Points(geo, new THREE.PointsMaterial({color:c.star, size:.55, sizeAttenuation:true, transparent:true, opacity:.9}));
  scene.add(starPoints);
}
function nebulaTexture(hex){
  const cv = document.createElement("canvas"); cv.width = cv.height = 256;
  const x = cv.getContext("2d");
  const g = x.createRadialGradient(128,128,10,128,128,128);
  g.addColorStop(0, hex); g.addColorStop(.45, hex + "66"); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; return t;
}
function buildNebula(){
  const c = THEME3D[S.theme] || THEME3D.gold;
  nebulas.forEach(disposeObj); nebulas = [];
  for(let i=0;i<4;i++){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:nebulaTexture(c.neb), transparent:true, opacity:.30, depthWrite:false, blending:THREE.AdditiveBlending}));
    sp.scale.setScalar(90 + Math.random()*80);
    sp.position.set((Math.random()-.5)*150, (Math.random()-.5)*90, -170 - Math.random()*70);
    scene.add(sp); nebulas.push(sp);
  }
}
